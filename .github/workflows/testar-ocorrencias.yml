name: Testar recebimento seguro de ocorrências
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testar-ocorrencias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar validação de ocorrências
        run: node --test tests/receber-ocorrencia.test.mjs tests/ocorrencias-formulario.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Conferir tipos do serviço de recebimento
        run: deno check supabase/functions/receber-ocorrencia/index.ts
