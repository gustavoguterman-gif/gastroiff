name: Build app icons
on:
  push:
    paths:
      - assets/app-icon-approved.svg
      - .github/workflows/build-app-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg
      - name: Generate Android and iOS PNG icons
        run: |
          python - <<'PY'
          import cairosvg
          for size in (180,192,512):
              cairosvg.svg2png(url='assets/app-icon-approved.svg',write_to=f'assets/app-icon-round-v2-{size}.png',output_width=size,output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-icon-round-v2-180.png assets/app-icon-round-v2-192.png assets/app-icon-round-v2-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza icones de instalacao GastroIFF"
            git push
          fi
