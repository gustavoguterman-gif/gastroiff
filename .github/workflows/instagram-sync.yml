name: Atualizar publicações do GASTROIFF
on:
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'
permissions:
  contents: write
jobs:
  instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar publicações da conta autorizada
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/sync_instagram.py
      - name: Publicar alterações do feed
        run: |
          git config user.name "gastroiff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/instagram-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar fotos públicas do Instagram"
            git push
          fi
