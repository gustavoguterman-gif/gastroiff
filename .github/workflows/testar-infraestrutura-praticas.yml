name: Testar infraestrutura privada das práticas
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261104230000_praticas_privadas.sql'
      - 'tests/praticas-db-setup.sql'
      - 'tests/praticas-db-permissoes.sql'
      - '.github/workflows/testar-infraestrutura-praticas.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infraestrutura-praticas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar-banco:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste_local_descartavel
          POSTGRES_DB: gastroiff_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gastroiff_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: teste_local_descartavel
      PGDATABASE: gastroiff_teste
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Preparar papéis e schemas fictícios no banco temporário
        run: psql -v ON_ERROR_STOP=1 -f tests/praticas-db-setup.sql
      - name: Executar migração verdadeira sobre PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261104230000_praticas_privadas.sql
      - name: Conferir isolamento, bloqueios e histórico
        run: psql -v ON_ERROR_STOP=1 -f tests/praticas-db-permissoes.sql
