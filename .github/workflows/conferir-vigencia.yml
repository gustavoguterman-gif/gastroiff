name: Conferir vigencia do GASTROIFF
on:
  schedule:
    - cron: '15 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar eventos e preparar pendencias
        id: auditar
        run: python3 scripts/auditar_vigencia.py
      - name: Registrar pendencias para revisao editorial
        if: steps.auditar.outputs.pendencias == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('relatorio-vigencia.md','utf8');
            const title = 'GASTROIFF: revisão semanal de eventos e prazos';
            const {data} = await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const found = data.find(x=>x.title===title && !x.pull_request);
            if (found) {
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:found.number,body});
            } else {
              await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
            }
