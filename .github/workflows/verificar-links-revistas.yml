name: Verificar links de revistas academicas
on:
  schedule:
    - cron: '23 10 10 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verificacao-revistas-academicas
  cancel-in-progress: false
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar classificacao de URLs sem acesso a rede
        run: python3 -m unittest discover -s tests -p 'test_links_revistas.py' -v
      - name: Verificar periodicos originais com limite de consultas
        run: python3 scripts/verificar_links_revistas.py
      - name: Salvar relatorio sem alterar site publico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saude-links-revistas
          path: reports/saude-revistas.json
          if-no-files-found: warn
          retention-days: 90
