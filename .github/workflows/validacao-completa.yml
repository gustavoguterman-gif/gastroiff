name: Validacao completa GASTROIFF
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacao-completa-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Iniciar servidor HTTP de teste
        run: |
          mkdir -p reports
          python3 -m http.server 8765 --bind 127.0.0.1 >reports/servidor-validacao.log 2>&1 &
      - name: Testes estaticos e unitarios
        run: |
          node --test tests/integridade-site.test.mjs tests/receber-ocorrencia.test.mjs tests/ocorrencias-formulario.test.mjs tests/ciclos-csv.test.cjs tests/apps-script-simulacao.test.cjs tests/insumos-csv.test.cjs tests/conciliacao-insumos.test.cjs tests/praticas-regras.test.cjs tests/praticas-documentos-leitor.test.cjs tests/praticas-quadro-docente.test.cjs tests/praticas-acesso.test.cjs tests/praticas-gestao-privada.test.cjs tests/praticas-aprovacao-rpc.test.cjs tests/praticas-aprovacao-api.test.cjs
      - name: Testar motor de descoberta de vagas sem rede
        run: python3 -m unittest discover -s tests -p 'test_monitorar_oportunidades.py' -v
      - name: Testar links academicos sem rede
        run: python3 -m unittest discover -s tests -p 'test_links_revistas.py' -v
      - name: Testar fontes institucionais sem rede
        run: python3 -m unittest discover -s tests -p 'test_fontes_iff.py' -v
      - name: Testar monitor de oportunidades no navegador
        run: node tests/oportunidades-monitoradas-navegador.cjs
      - name: Teste funcional de perfis e ocorrencias
        run: node tests/verificar-perfis-navegador.cjs
      - name: Testar trajetorias da docencia em tres formatos
        run: node tests/trajetorias-docencia-navegador.cjs
      - name: Teste funcional do calendario
        run: node tests/verificar-calendario-navegador.cjs
      - name: Teste funcional do planejamento docente
        run: node tests/planejamento-docente-navegador.cjs
      - name: Verificar autorização do painel docente em celular, tablet e desktop
        run: node tests/praticas-painel-autenticado-navegador.cjs
      - name: Verificar revisão e bloqueio de aprovação em três telas
        run: node tests/praticas-aprovacao-navegador.cjs
      - name: Verificar gravação autenticada da Gestão em celular tablet e computador
        run: node tests/praticas-gestao-privada-navegador.cjs
      - name: Testar Gestão das práticas e painel docente somente leitura
        run: node tests/praticas-gestao-navegador.cjs
      - name: Validar PWA, ícones, offline e navegação mobile/desktop
        run: node tests/pwa-mobile-desktop.cjs
      - name: Inspecao de todas as paginas em celular e desktop
        run: node tests/auditoria-geral.cjs
      - name: Verificar site atualmente publicado em celular e computador
        run: node tests/site-publicado-navegador.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Conferir tipos do servico protegido
        run: deno check supabase/functions/receber-ocorrencia/index.ts
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-completa-gastroiff
          path: reports/
          if-no-files-found: ignore
