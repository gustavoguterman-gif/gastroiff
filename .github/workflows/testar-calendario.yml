name: Testar calendario multidiario
on:
  push:
    paths:
      - 'gestao.html'
      - 'tests/verificar-calendario-navegador.cjs'
      - '.github/workflows/testar-calendario.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Iniciar servidor
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gastroiff-calendario-http.log 2>&1 &
      - name: Testar importacao de um evento multidiario
        run: node tests/verificar-calendario-navegador.cjs
