name: Testar calendario multidiario
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: testar-calendario-${{ github.ref }}
  cancel-in-progress: true
jobs:
  teste:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Iniciar servidor
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gastroiff-calendario-http.log 2>&1 &
      - name: Testar importacao de um evento multidiario
        run: node tests/verificar-calendario-navegador.cjs
