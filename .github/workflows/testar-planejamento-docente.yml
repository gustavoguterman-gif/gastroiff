name: Testar planejamento docente
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: testar-planejamento-docente-${{ github.ref }}
  cancel-in-progress: true
jobs:
  navegador:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir paginas
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gastroiff-planejamento-http.log 2>&1 &
      - name: Testar leitura CSV
        run: node --test tests/ciclos-csv.test.cjs tests/apps-script-simulacao.test.cjs
      - name: Testar planejamento docente
        run: node tests/planejamento-docente-navegador.cjs
