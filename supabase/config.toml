project_id = "gastroiff-local-rls"

# Arquivos de preparação. Não ativar sem configuração de um projeto seguro.
# A função de ocorrências só recebe envios se GASTROIFF_OCCURRENCES_ENABLED=true.
# Não definir essa variável antes de autorizar e testar o serviço protegido.
[functions.receber-ocorrencia]
verify_jwt = false

# Recebimento por convite privado e desafio antiabuso.
# O endpoint permanece inativo sem a variável explícita GASTROIFF_EGRESSO_SUBMISSIONS_ENABLED=true.
[functions.receber-egresso]
verify_jwt = false
